<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <script>
            let theme = 'auto'
            try {
                theme = localStorage.getItem('screen-design-color-scheme') || 'auto'
            } catch {
                // 存储不可用时沿用系统主题。
            }
            document.documentElement.classList.toggle(
                'dark',
                theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches),
            )
        </script>
        <link
            rel="icon"
            href="/favicon.ico"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Vite App</title>
    </head>
    <body>
        <div id="app"></div>
        <script
            type="module"
            src="/src/main.ts"
        ></script>
    </body>
</html>
